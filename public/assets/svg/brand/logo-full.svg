<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%" fill="none">
  <!-- Monogram Mark -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" stroke="#C6923B" stroke-width="2" fill="#152238" />
    <circle cx="50" cy="50" r="42" stroke="#C6923B" stroke-width="1" stroke-dasharray="3 3" fill="none" opacity="0.7"/>
    <!-- Intertwined F and V monogram with batik flourish -->
    <path d="M36 28 H64 C70 28 72 32 68 36 C64 40 58 40 52 40 H40 V72 C40 76 34 76 34 72 Z" fill="#C6923B"/>
    <path d="M46 48 H60 C64 48 66 52 62 55 H46 Z" fill="#E8C37B"/>
    <path d="M48 45 L62 72 C64 76 68 76 70 72 L82 45" stroke="#E8C37B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="20" r="3" fill="#C6923B" />
    <circle cx="50" cy="80" r="3" fill="#C6923B" />
    <circle cx="20" cy="50" r="3" fill="#C6923B" />
    <circle cx="80" cy="50" r="3" fill="#C6923B" />
  </g>
  <!-- Typography -->
  <g transform="translate(125, 25)">
    <text x="0" y="40" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="3" fill="#C6923B">
      FuRi Valentine
    </text>
    <text x="2" y="65" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" letter-spacing="8" fill="#E8C37B" opacity="0.9">
      BATIK HERITAGE
    </text>
  </g>
</svg>
