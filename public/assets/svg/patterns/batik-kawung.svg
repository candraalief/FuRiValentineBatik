<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="kawung-unit" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="transparent"/>
      <!-- Kawung 4-lobed ellipse intersection -->
      <!-- Center 4 petals -->
      <ellipse cx="40" cy="20" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="40" cy="60" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="20" cy="40" rx="20" ry="14" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="60" cy="40" rx="20" ry="14" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      
      <!-- Inner diamond seeds -->
      <circle cx="40" cy="40" r="3" fill="#C6923B" opacity="0.5"/>
      <circle cx="40" cy="20" r="2" fill="#C6923B" opacity="0.3"/>
      <circle cx="40" cy="60" r="2" fill="#C6923B" opacity="0.3"/>
      <circle cx="20" cy="40" r="2" fill="#C6923B" opacity="0.3"/>
      <circle cx="60" cy="40" r="2" fill="#C6923B" opacity="0.3"/>
      
      <!-- Corners for seamless repeat -->
      <ellipse cx="0" cy="0" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="80" cy="0" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="0" cy="80" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
      <ellipse cx="80" cy="80" rx="14" ry="20" fill="none" stroke="#C6923B" stroke-width="1.5" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="url(#kawung-unit)"/>
</svg>
